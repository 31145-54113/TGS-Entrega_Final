<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargando… · Gestión de Tareas Académicas</title>

  <script>
    // Redirige inmediatamente según exista o no token.
    // Se ejecuta antes de que se pinte nada → cero flash.
    location.replace(
      localStorage.getItem("access_token") ? "app.html" : "login.html"
    );
  </script>
</head>
<body>
  <noscript>
    <p>Necesitás activar JavaScript para usar la aplicación.</p>
    <p><a href="login.html">Ir al inicio de sesión</a></p>
  </noscript>
</body>
</html>
